name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Verify build output
        run: |
          echo "--- dist tree ---"
          find ./dist -maxdepth 2 -type d | sort
          echo "--- index.html candidates ---"
          find ./dist -name index.html | sort
          if [ ! -f ./dist/client/index.html ]; then
            echo "ERROR: ./dist/client/index.html was not generated. Prerendering failed in CI."
            exit 1
          fi

      - name: SPA fallback for GitHub Pages
        run: cp ./dist/client/index.html ./dist/client/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/client'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
