name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Inspect build output
        run: |
          echo ""
          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          echo ""
          echo "--- .output/public directory ---"
          find ./.output/public -maxdepth 3 -type f | sort

          echo ""
          echo "--- File sizes ---"
          du -ah ./.output/public | sort -h

          echo ""
          echo "--- HTML files ---"
          find ./.output/public -type f \( -name "*.html" -o -name "*.htm" \) -print

          echo ""
          echo "--- Image files ---"
          find ./.output/public -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" -o -iname "*.svg" -o -iname "*.gif" \) \
            -print

          echo ""
          echo "--- JavaScript files ---"
          find ./.output/public -type f -name "*.js" -print


      - name: Inspect JavaScript asset paths
        run: |
          echo ""
          echo "========================================"
          echo "IMAGE/ASSET REFERENCES IN JAVASCRIPT"
          echo "========================================"

          echo ""
          echo "--- JPG references ---"
          grep -RohE '["'\''][^"'\'']*\.jpg[^"'\'']*["'\'']' ./.output/public/assets/*.js || true

          echo ""
          echo "--- PNG references ---"
          grep -RohE '["'\''][^"'\'']*\.png[^"'\'']*["'\'']' ./.output/public/assets/*.js || true

          echo ""
          echo "--- WebP references ---"
          grep -RohE '["'\''][^"'\'']*\.webp[^"'\'']*["'\'']' ./.output/public/assets/*.js || true

          echo ""
          echo "--- /assets/ references ---"
          grep -RohE '["'\''][^"'\'']*/assets/[^"'\'']*["'\'']' ./.output/public/assets/*.js | head -100 || true

          echo ""
          echo "--- hero/logo references ---"
          grep -RoiE '.{0,100}(hero|logo).{0,150}' ./.output/public/assets/*.js | head -100 || true



          echo ""
          echo "--- CSS files ---"
          find ./.output/public -type f -name "*.css" -print

          echo ""
          echo "========================================"
          echo "INDEX.HTML"
          echo "========================================"

          if [ ! -f ./.output/public/index.html ]; then
            echo "ERROR: index.html does not exist!"
            exit 1
          fi

          echo ""
          echo "--- index.html ---"
          cat ./.output/public/index.html

          echo ""
          echo "========================================"
          echo "IMAGE REFERENCES IN HTML"
          echo "========================================"

          grep -oE '((src|href)=["'\''][^"'\'']+|url\([^)]*\))' \
            ./.output/public/index.html || true

          echo ""
          echo "========================================"
          echo "ASSET PATH REFERENCES"
          echo "========================================"

          grep -oE '(/assets/[^"'\'' )]+|assets/[^"'\'' )]+)' \
            ./.output/public/index.html | sort -u || true

          echo ""
          echo "========================================"
          echo "CHECKING REFERENCED ASSETS"
          echo "========================================"

          for asset in $(grep -oE '/assets/[^"'\'' )]+' ./.output/public/index.html | sort -u); do
            clean_asset="${asset#/}"

            if [ -f "./.output/public/$clean_asset" ]; then
              echo "OK: $asset"
            else
              echo "MISSING: $asset"
            fi
          done

          echo ""
          echo "========================================"
          echo "CHECK COMPLETE"
          echo "========================================"

      - name: SPA fallback for GitHub Pages
        run: cp ./.output/public/index.html ./.output/public/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
