name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Inspect asset references
        run: |
          echo "========================================"
          echo "ASSET REFERENCES"
          echo "========================================"

          echo ""
          echo "--- hero ---"
          grep -RoiE '.{0,150}hero.{0,200}' ./.output/public/assets/*.js | head -30 || true

          echo ""
          echo "--- logo ---"
          grep -RoiE '.{0,150}logo.{0,200}' ./.output/public/assets/*.js | head -30 || true

          echo ""
          echo "--- jpg/png ---"
          grep -RoiE '.{0,100}\.(jpg|jpeg|png|webp|svg).{0,150}' \
            ./.output/public/assets/*.js | head -50 || true

          echo ""
          echo "--- assets paths ---"
          grep -RoiE '.{0,100}/assets/.{0,200}' \
            ./.output/public/assets/*.js | head -50 || true

          echo ""
          echo "========================================"
          echo "PUBLIC FILES"
          echo "========================================"

          find ./.output/public -type f | sort

          echo ""
          echo "========================================"
          echo "CHECK COMPLETE"
          echo "========================================"

      - name: SPA fallback for GitHub Pages
        run: cp ./.output/public/index.html ./.output/public/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./.output/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
