name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Download and rewrite Lovable assets
        run: |
          set -e

          echo "========================================"
          echo "LOVABLE ASSET FIX"
          echo "========================================"

          mkdir -p ./.output/public/assets

          python3 <<'PY'
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urlparse

          public_dir = Path("./.output/public")
          assets_dir = public_dir / "assets"

          # Search all generated JS/CSS/HTML files.
          files = []
          for ext in ("*.js", "*.css", "*.html"):
              files.extend(public_dir.rglob(ext))

          # Find Lovable asset URLs.
          pattern = re.compile(
              r'(https?://[^"\'\s<>()]+)?'
              r'(/__l5e/assets-v1/[^"\'\s<>()]+)'
          )

          found = {}

          for file in files:
              try:
                  text = file.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              for match in pattern.finditer(text):
                  full_url = match.group(0)

                  # Remove trailing punctuation that may be part of JS/HTML.
                  full_url = full_url.rstrip('.,;:)]}')

                  if full_url.startswith("/"):
                      full_url = "https://west-coast-climb-site.lovable.app" + full_url

                  parsed = urlparse(full_url)
                  path = parsed.path

                  filename = Path(path).name

                  # Only process actual image files.
                  if not re.search(
                      r'\.(jpg|jpeg|png|webp|gif|svg|avif)$',
                      filename,
                      re.IGNORECASE
                  ):
                      continue

                  found[full_url] = filename

          print()
          print("Found Lovable assets:")
          print()

          if not found:
              print("No Lovable assets found.")
              raise SystemExit(0)

          for url, filename in found.items():
              print(f"  {filename}")
              print(f"  {url}")
              print()

          # Download every unique asset.
          for url, filename in found.items():
              destination = assets_dir / filename

              print(f"Downloading {filename}...")

              result = subprocess.run(
                  [
                      "curl",
                      "-L",
                      "--fail",
                      "--silent",
                      "--show-error",
                      url,
                      "-o",
                      str(destination),
                  ],
                  text=True,
              )

              if result.returncode != 0:
                  print(f"ERROR downloading: {url}")
                  raise SystemExit(result.returncode)

              if not destination.exists() or destination.stat().st_size == 0:
                  print(f"ERROR: downloaded file is empty: {destination}")
                  raise SystemExit(1)

          # Replace Lovable URLs with local GitHub Pages URLs.
          print()
          print("Rewriting asset references...")

          for file in files:
              try:
                  text = file.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              original = text

              for url, filename in found.items():
                  text = text.replace(url, f"/assets/{filename}")

                  # Also replace the relative Lovable path in case
                  # the generated code did not contain the full domain.
                  relative_path = urlparse(url).path
                  text = text.replace(
                      relative_path,
                      f"/assets/{filename}"
                  )

              if text != original:
                  file.write_text(text, encoding="utf-8")
                  print(f"Updated: {file}")

          print()
          print("Asset processing complete.")
          PY

          echo ""
          echo "========================================"
          echo "LOCAL ASSETS"
          echo "========================================"

          find ./.output/public/assets -type f | sort

          echo ""
          echo "========================================"
          echo "IMAGE COUNT"
          echo "========================================"

          find ./.output/public/assets -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" -o -iname "*.gif" -o -iname "*.svg" \) \
            | wc -l

      - name: Verify no Lovable asset URLs remain
        run: |
          echo "========================================"
          echo "CHECKING FOR REMAINING LOVABLE ASSETS"
          echo "========================================"

          if grep -RniE '/__l5e/assets-v1/' ./.output/public \
            --include="*.js" \
            --include="*.css" \
            --include="*.html"; then

            echo ""
            echo "WARNING: Lovable asset references still exist."
            echo "The deployment will continue, but some assets may still be external."

          else

            echo ""
            echo "SUCCESS: No Lovable asset URLs remain."

          fi

      - name: Verify local image files
        run: |
          echo "========================================"
          echo "VERIFYING IMAGE FILES"
          echo "========================================"

          find ./.output/public/assets -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" -o -iname "*.gif" -o -iname "*.svg" \) \
            -print

          echo ""
          echo "File sizes:"
          du -ah ./.output/public/assets | sort -h

      - name: SPA fallback for GitHub Pages
        run: |
          cp ./.output/public/index.html ./.output/public/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./.output/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
